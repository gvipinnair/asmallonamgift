<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f0df">
  <title>Onam Surprise — Gowri</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="movie" aria-label="Onam surprise for Gowri">
    <div class="stage">
      <img id="panel" class="panel" src="assets/panels/panel-01.png" alt="Onam surprise panel">

      <!-- Click targets sit over the buttons drawn inside the exact artwork. -->
      <button id="openDoor" class="hotspot hotspot-intro" aria-label="Open the door"></button>
      <button id="comeInside" class="hotspot hotspot-come" aria-label="Come inside"></button>
      <button id="enterHall" class="hotspot hotspot-hall" aria-label="Enter the hall"></button>
    </div>

    <div class="controls">
      <button id="prev" class="control" type="button">←</button>
      <div class="progress" aria-label="Story progress"><span id="progressFill"></span></div>
      <button id="next" class="control" type="button">→</button>
    </div>
    <p class="hint" id="hint">Click “Open the door” to begin ✨</p>
  </main>

  <audio id="voice" preload="auto" src="assets/gowri-voice.mp3"></audio>
  <script src="script.js"></script>
</body>
</html>
